<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified hex mark (light): outer hex + mauve active-shard wedge + 3 spokes. -->
  <rect width="256" height="256" rx="56" fill="#FAFAFA"/>

  <!-- active shard wedge (top → upper-right) -->
  <path d="M128 128 L128 44 L200 86 Z" fill="#B7ABB0"/>

  <!-- 3 spokes: the two wedge edges + the bottom -->
  <g stroke="#09090B" stroke-width="11" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="44"/>
    <line x1="128" y1="128" x2="200" y2="86"/>
    <line x1="128" y1="128" x2="128" y2="212"/>
  </g>

  <!-- outer hex -->
  <polygon points="128,44 200,86 200,170 128,212 56,170 56,86"
           fill="none" stroke="#09090B" stroke-width="13" stroke-linejoin="round"/>
</svg>
