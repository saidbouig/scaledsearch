<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified mark for small sizes: hex + mauve wedge + minimal spokes. -->
  <rect width="32" height="32" rx="7" fill="#09090B"/>
  <!-- wedge -->
  <path d="M16 16 L16 5 L25.5 10.5 Z" fill="#B7ABB0"/>
  <!-- 3 spokes only (the two wedge edges + bottom) -->
  <g stroke="#FAFAFA" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="5"/>
    <line x1="16" y1="16" x2="25.5" y2="10.5"/>
    <line x1="16" y1="16" x2="16" y2="27"/>
  </g>
  <!-- outer hex -->
  <polygon points="16,5 25.5,10.5 25.5,21.5 16,27 6.5,21.5 6.5,10.5"
           fill="none" stroke="#FAFAFA" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
